# AWS Amplify Hosting — Vite app in monorepo folder `client/`
# https://docs.aws.amazon.com/amplify/latest/userguide/build-settings.html
version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
